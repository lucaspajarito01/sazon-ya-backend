services:
  mysql:
    image: mysql:8.0
    container_name: sazon_ya_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-SazonYa_Root_2026!}
      MYSQL_DATABASE: ${DB_NAME:-sazon_ya}
      MYSQL_USER: ${DB_USER:-sazon_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SazonYa_App_2026!}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - sazon_ya_mysql_data:/var/lib/mysql
      - ./database/ddl/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/ddl/02_indices.sql:/docker-entrypoint-initdb.d/02_indices.sql:ro
      - ./database/dml/01_seed_inicial.sql:/docker-entrypoint-initdb.d/03_seed_inicial.sql:ro
      - ./database/dql/trigger.sql:/docker-entrypoint-initdb.d/04_trigger.sql:ro
      - ./database/dql/views.sql:/docker-entrypoint-initdb.d/05_views.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sazon_ya_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      API_VERSION: ${API_VERSION:-1.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DB_MODE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-sazon_app}
      DB_PASSWORD: ${DB_PASSWORD:-SazonYa_App_2026!}
      DB_NAME: ${DB_NAME:-sazon_ya}
      JWT_SECRET: ${JWT_SECRET:-sazon_ya_super_secret_hmac_key_2026_clean_architecture}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-7200}
    ports:
      - "${PORT:-3001}:3001"

volumes:
  sazon_ya_mysql_data:
    name: sazon_ya_mysql_data
